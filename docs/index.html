<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Top 5 Trivia</title>
<meta name="description" content="Name the top five. Order doesn't matter. Three strikes and you're out.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one narrow column; a game-show answer board is the centerpiece. */
:root {
  --bg: #e9edf3;
  --surface: #ffffff;
  --ink: #142038;
  --muted: #586378;
  --line: #cfd6e2;
  --board: #1b2f5c;
  --board-deep: #12224a;
  --board-ink: #fbf3dc;
  --marquee: #e6a21a;
  --good: #23855a;
  --bad: #c2392b;
  --good-soft: #dff3e8;
  --bad-soft: #fbe3e0;
  --font-display: "Alfa Slab One", Rockwell, "Roboto Slab", Georgia, serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c1424;
    --surface: #141f36;
    --ink: #e7ecf5;
    --muted: #96a2ba;
    --line: #26344f;
    --board: #203a72;
    --board-deep: #172b57;
    --board-ink: #fbf3dc;
    --marquee: #f0b437;
    --good: #4cc38a;
    --bad: #ef6b5c;
    --good-soft: #143a2a;
    --bad-soft: #42201e;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 var(--font-body);
  padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
}
.wrap { max-width: 560px; margin: 0 auto; padding-block: 24px 48px; display: grid; gap: 20px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--marquee); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* Header */
.masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.wordmark { font-family: var(--font-display); font-weight: 400; font-size: 2.4rem; line-height: 1; letter-spacing: .01em; }
.wordmark span { color: var(--marquee); }
.tag { font-size: .75rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Menu */
.rules { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.rules h2 { font-size: 1rem; margin-bottom: 8px; }
.rules ul { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; }
.rules b { font-variant-numeric: tabular-nums; }
.level h3 { font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.level-list { display: grid; gap: 8px; }
.pick {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; text-align: left; padding: 12px 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
.pick:hover { border-color: var(--marquee); }
.pick-title { font-weight: 600; min-width: 0; }
.chip { flex: none; font-size: .8rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-variant-numeric: tabular-nums; }
.chip.played { background: var(--board); border-color: var(--board); color: var(--board-ink); }
.reset { justify-self: start; background: none; border: none; padding: 0; color: var(--muted); text-decoration: underline; font-size: .85rem; }

/* Game */
.back { justify-self: start; background: none; border: none; padding: 0; color: var(--muted); font-weight: 600; }
.q-head { display: grid; gap: 6px; }
.q-level { font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.q-prompt { font-size: 1.45rem; line-height: 1.25; font-weight: 800; }
.q-rule { color: var(--muted); font-size: .92rem; margin: 0; }
.q-source { color: var(--muted); font-size: .8rem; margin: 0; }

.status { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.score { display: flex; align-items: baseline; gap: 8px; }
.score-num { font-family: var(--font-display); font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.score-label { font-size: .8rem; color: var(--muted); font-weight: 600; }
.strikes { display: flex; gap: 6px; }
.strike {
  width: 34px; height: 34px; border-radius: 6px; display: grid; place-items: center;
  border: 2px solid var(--line); color: transparent; font-weight: 800; font-size: 1.1rem;
}
.strike.on { border-color: var(--bad); background: var(--bad); color: #fff; }

.board { background: var(--board-deep); border-radius: 14px; padding: 10px; display: grid; gap: 8px; }
.tile { display: grid; grid-template-columns: 52px 1fr; min-height: 56px; perspective: 600px; }
.tile-rank {
  display: grid; place-items: center; background: var(--marquee); color: var(--board-deep);
  font-family: var(--font-display); font-size: 1.3rem; border-radius: 8px 0 0 8px;
}
.tile-face {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 14px;
  background: var(--board); color: var(--board-ink); border-radius: 0 8px 8px 0; min-width: 0;
}
.tile-face .name { font-weight: 800; font-size: 1.05rem; min-width: 0; overflow-wrap: anywhere; }
.tile-face .val { font-size: .85rem; opacity: .85; font-variant-numeric: tabular-nums; text-align: right; }
.tile.hidden .tile-face { background: repeating-linear-gradient(135deg, var(--board) 0 10px, var(--board-deep) 10px 20px); }
.tile.revealed .tile-face { animation: flip .45s ease-out; }
.tile.missed .tile-face { background: var(--board-deep); color: var(--board-ink); opacity: .7; }
.tile.missed .name::after { content: " (missed)"; font-weight: 400; font-size: .8rem; }
@keyframes flip { from { transform: rotateX(90deg); } to { transform: rotateX(0); } }

.entry { display: grid; gap: 10px; }
.entry-row { display: flex; gap: 8px; }
.entry-row input {
  flex: 1; min-width: 0; padding: 12px 14px; border-radius: 10px; border: 2px solid var(--line);
  background: var(--surface); font-size: 1.05rem;
}
.entry-row input:focus { border-color: var(--marquee); outline: none; }
.btn {
  padding: 12px 18px; border-radius: 10px; border: 2px solid var(--board); background: var(--board);
  color: var(--board-ink); font-weight: 800;
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.small { padding: 6px 12px; font-size: .9rem; border-width: 1px; }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; min-height: 0; }
.suggest button {
  padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: .9rem;
}
.suggest button:hover { border-color: var(--marquee); }

.feedback { border-radius: 10px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 8px; }
.feedback.good { background: var(--good-soft); border-color: var(--good); }
.feedback.bad { background: var(--bad-soft); border-color: var(--bad); }
.feedback p { margin: 0; }
.feedback .actions { display: flex; flex-wrap: wrap; gap: 6px; }

.misses { display: grid; gap: 4px; }
.misses h4 { margin: 0; font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.misses ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.misses li { font-size: .85rem; padding: 2px 10px; border-radius: 999px; background: var(--bad-soft); border: 1px solid var(--bad); }

.stop-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.stop-row p { margin: 0; flex-basis: 100%; }

.result { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 12px; }
.result h3 { font-size: 1.1rem; }
.breakdown { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; font-variant-numeric: tabular-nums; }
.breakdown dt { color: var(--muted); }
.breakdown dd { margin: 0; text-align: right; font-weight: 600; }
.breakdown .total { color: var(--ink); font-weight: 800; border-top: 1px solid var(--line); padding-top: 4px; }
.near h4 { margin: 0 0 4px; font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.near ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: .92rem; }
.near li { display: flex; justify-content: space-between; gap: 12px; }
.near .r { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.share pre {
  margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line);
  font: .95rem/1.4 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere;
}
.share { display: grid; gap: 8px; }
.end-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  .tile.revealed .tile-face { animation: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="wordmark">Top <span>5</span></div>
    <div class="tag">Playtest build</div>
  </header>

  <main id="menu" class="wrap" style="padding:0">
    <section class="rules" aria-labelledby="rules-h">
      <h2 id="rules-h">How to play</h2>
      <ul id="rules-list"></ul>
    </section>
    <div id="levels" class="wrap" style="padding:0;gap:18px"></div>
    <button class="reset" id="reset" type="button">Clear my scores on this device</button>
    <p class="q-source" id="reset-msg" hidden></p>
  </main>

  <main id="game" class="wrap" style="padding:0" hidden>
    <button class="back" id="back" type="button">&larr; All puzzles</button>
    <div class="q-head">
      <div class="q-level" id="q-level"></div>
      <h2 class="q-prompt" id="q-prompt"></h2>
      <p class="q-rule" id="q-rule"></p>
      <p class="q-source" id="q-source"></p>
    </div>

    <div class="status">
      <div class="score"><span class="score-num" id="score">0</span><span class="score-label">points</span></div>
      <div class="strikes" id="strikes" aria-label="Strikes"></div>
    </div>

    <div class="board" id="board"></div>

    <div class="entry" id="entry">
      <form class="entry-row" id="guess-form" autocomplete="off">
        <label for="guess" class="sr">Your guess</label>
        <input id="guess" type="text" placeholder="Type an answer" autocapitalize="words" spellcheck="false" enterkeyhint="go">
        <button class="btn" type="submit">Guess</button>
      </form>
      <div class="suggest" id="suggest" aria-label="Suggestions"></div>
    </div>

    <div class="feedback" id="feedback" role="status" aria-live="polite" hidden></div>

    <div class="misses" id="misses" hidden>
      <h4>Misses</h4>
      <ul id="miss-list"></ul>
    </div>

    <div class="stop-row" id="stop-row">
      <button class="btn ghost small" id="stop" type="button">I'm done</button>
    </div>

    <section class="result" id="result" hidden aria-live="polite">
      <h3 id="result-h"></h3>
      <dl class="breakdown" id="breakdown"></dl>
      <div class="near" id="near"></div>
      <div class="share">
        <pre id="share-text"></pre>
        <div class="end-actions">
          <button class="btn small" id="copy" type="button">Copy result</button>
          <button class="btn ghost small" id="next" type="button">Next puzzle</button>
        </div>
        <p class="q-source" id="copy-msg" hidden></p>
      </div>
    </section>
  </main>
</div>

// ----- Matching (ported from Top5Core's Normalizer and Matcher) -----

function normalize(input) {
  let s = input.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/['’]/g, "").replace(/&/g, " and ").replace(/[^a-z0-9]+/g, " ").trim();
  const words = s.split(" ").filter(Boolean);
  if (words.length > 1 && words[0] === "the") words.shift();
  return words.join(" ");
}

function editDistance(a, b) {
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[b.length];
}

// No fuzzy matching under 5 characters: Iran/Iraq, Mali/Bali are one edit apart.
function allowedEdits(n) { return n < 5 ? 0 : n <= 8 ? 1 : 2; }

function parsePool(text) {
  return text.trim().split("\n").map(line => {
    const outOfScope = line.startsWith("!");
    const [id, name, aliases = ""] = line.replace(/^!/, "").split("|");
    return { id, name, aliases: aliases ? aliases.split(";") : [], outOfScope };
  });
}

function makeMatcher(entries) {
  const keys = [];
  for (const e of entries) for (const v of [e.name, ...e.aliases]) keys.push({ t: normalize(v), e });
  const uniq = list => [...new Map(list.map(e => [e.id, e])).values()];

  return {
    // exact -> submit; choose -> player picks one; suggest -> "Did you mean?"; none
    lookup(input) {
      const q = normalize(input);
      if (!q) return { kind: "none" };
      const exact = uniq(keys.filter(k => k.t === q).map(k => k.e));
      if (exact.length === 1) return { kind: "exact", entry: exact[0] };
      if (exact.length > 1) return { kind: "choose", entries: exact };
      if (q.length >= 3) {
        const pre = uniq(keys.filter(k => k.t.startsWith(q)).map(k => k.e));
        if (pre.length === 1) return { kind: "suggest", entry: pre[0] };
        if (pre.length > 1 && pre.length <= 4) return { kind: "choose", entries: pre };
      }
      const allowed = allowedEdits(q.length);
      if (allowed > 0) {
        let best = Infinity, hits = [];
        for (const k of keys) {
          const d = editDistance(q, k.t);
          if (d > allowed) continue;
          if (d < best) { best = d; hits = [k.e]; } else if (d === best) hits.push(k.e);
        }
        hits = uniq(hits);
        if (hits.length === 1) return { kind: "suggest", entry: hits[0] };
        if (hits.length > 1 && hits.length <= 4) return { kind: "choose", entries: hits };
      }
      return { kind: "none" };
    },
    completions(input, limit = 5) {
      const q = normalize(input);
      if (q.length < 2) return [];
      return uniq(keys.filter(k => k.t.startsWith(q) || k.t.includes(" " + q)).map(k => k.e)).slice(0, limit);
    },
  };
}

// ----- Round state -----

function newRound(q) {
  const entries = parsePool(POOLS[q.pool]);
  const byId = Object.fromEntries(entries.map(e => [e.id, e]));
  return {
    q, byId, matcher: makeMatcher(entries),
    found: new Set(), guessed: new Set(), misses: [], log: [], over: false, endReason: null,
  };
}

function scoreOf(r) {
  const base = Math.max(0, r.found.size * RULES.pointsPerFind - r.misses.length * RULES.strikeCost);
  const sweep = r.found.size === 5 && r.misses.length === 0 ? RULES.sweepBonus : 0;
  return { base, sweep, total: base + sweep };
}

// Returns { tone: "good"|"bad"|"info", text } describing what happened.
function guessEntry(r, entry) {
  if (r.over) return { tone: "info", text: "This round is over." };
  if (entry.outOfScope) return { tone: "info", text: OUT_OF_SCOPE[entry.id] || `${entry.name} doesn't count here. No strike.` };
  if (r.guessed.has(entry.id)) return { tone: "info", text: `You already guessed ${entry.name}. No strike.` };
  r.guessed.add(entry.id);

  const slot = r.q.answers.findIndex(([id]) => id === entry.id);
  if (slot >= 0) {
    r.found.add(entry.id);
    r.log.push("hit");
    if (r.found.size === 5) end(r, "sweep");
    return { tone: "good", text: `${entry.name} is on the board.`, slot };
  }
  return miss(r, entry.name, entry.id);
}

function miss(r, name, id) {
  r.log.push("miss");
  const near = id && r.q.near.find(([nid]) => nid === id);
  let text;
  if (r.q.notes[id]) text = r.q.notes[id];
  else if (near) text = r.q.nearMsg ? r.q.nearMsg(name, near[1]) : `${name} is ${near[1]}. So close.`;
  else text = `${name} isn't in the top 10.`;
  r.misses.push({ name, label: near ? (r.q.nearShow ? r.q.nearShow(near[1]) : near[1]) : "" });
  text += ` Strike ${r.misses.length}, minus ${RULES.strikeCost} points.`;
  if (r.misses.length >= RULES.maxStrikes) end(r, "struck");
  return { tone: "bad", text };
}

function guessFreeform(r, raw) {
  if (r.over) return { tone: "info", text: "This round is over." };
  const name = raw.trim().replace(/\s+/g, " ");
  const key = "free:" + normalize(name);
  if (r.guessed.has(key)) return { tone: "info", text: `You already guessed ${name}. No strike.` };
  r.guessed.add(key);
  return miss(r, name, null);
}

function end(r, reason) { r.over = true; r.endReason = reason; }

function shareText(r) {
  const s = scoreOf(r);
  const row = r.log.map(x => (x === "hit" ? "🟩" : "❌")).join("") + "⬜".repeat(5 - r.found.size);
  return `Top 5 · ${r.q.title}\n${row} ${s.total}/${5 * RULES.pointsPerFind + RULES.sweepBonus}`;
}
</script>

<script>
// ===== UI =====
const $ = id => document.getElementById(id);
const STORE_KEY = "top5-playtest-v1";
let round = null;

function loadScores() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }
}
function saveScore(qid, data) {
  try {
    const all = loadScores();
    if (!all[qid]) { all[qid] = data; localStorage.setItem(STORE_KEY, JSON.stringify(all)); }
  } catch { /* storage unavailable: scores just aren't remembered */ }
}

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const k of kids) n.append(k);
  return n;
}

// ----- Menu -----
function renderMenu() {
  const max = 5 * RULES.pointsPerFind + RULES.sweepBonus;
  $("rules-list").replaceChildren(
    el("li", {}, "Name all five answers. Order doesn't matter."),
    el("li", {}, el("b", {}, `+${RULES.pointsPerFind}`), " for each answer you find."),
    el("li", {}, el("b", {}, `−${RULES.strikeCost}`), ` for each miss. ${RULES.maxStrikes} misses and the round ends.`),
    el("li", {}, "Find all five with no misses for a ", el("b", {}, `+${RULES.sweepBonus}`), ` bonus (${max} max).`),
    el("li", {}, "Typos and repeats never count as misses. Stop any time with “I'm done” to keep your points."),
  );
  const scores = loadScores();
  const levels = ["Easy", "Medium", "Hard"].map(level => {
    const list = el("div", { class: "level-list" });
    for (const q of QUESTIONS.filter(q => q.level === level)) {
      const s = scores[q.id];
      list.append(el("button", { class: "pick", type: "button", onclick: () => startGame(q) },
        el("span", { class: "pick-title" }, q.title),
        el("span", { class: "chip" + (s ? " played" : "") }, s ? `${s.score} pts` : "Play")));
    }
    return el("section", { class: "level" }, el("h3", {}, level), list);
  });
  $("levels").replaceChildren(...levels);
}

function showMenu() {
  $("game").hidden = true; $("menu").hidden = false;
  renderMenu();
  window.scrollTo(0, 0);
}

// ----- Game -----
function startGame(q) {
  round = newRound(q);
  $("menu").hidden = true; $("game").hidden = false;
  $("q-level").textContent = q.level;
  $("q-prompt").textContent = q.prompt;
  $("q-rule").textContent = q.rule;
  $("q-source").textContent = q.source;
  $("result").hidden = true;
  $("entry").hidden = false;
  $("guess").value = "";
  setFeedback(null);
  renderStop();
  renderAll();
  window.scrollTo(0, 0);
  $("guess").focus({ preventScroll: true });
}

function renderAll() {
  const r = round, s = scoreOf(r);
  $("score").textContent = r.over ? s.total : s.base;
  $("strikes").replaceChildren(...Array.from({ length: RULES.maxStrikes }, (_, i) =>
    el("span", { class: "strike" + (i < r.misses.length ? " on" : ""), "aria-hidden": "true" }, "✕")));
  $("strikes").setAttribute("aria-label", `${r.misses.length} of ${RULES.maxStrikes} strikes`);
  renderBoard();
  $("misses").hidden = r.misses.length === 0;
  $("miss-list").replaceChildren(...r.misses.map(m => el("li", {}, m.label ? `${m.name} (${m.label})` : m.name)));
  renderSuggestions();
  if (r.over) renderResult();
}

function renderBoard(flipSlot) {
  const r = round;
  $("board").replaceChildren(...r.q.answers.map(([id, value], i) => {
    const found = r.found.has(id), reveal = found || r.over;
    const cls = "tile " + (found ? "revealed" : r.over ? "missed" : "hidden");
    const tile = el("div", { class: cls },
      el("div", { class: "tile-rank" }, r.q.slots ? r.q.slots[i] : String(i + 1)),
      el("div", { class: "tile-face" },
        el("span", { class: "name" }, reveal ? r.byId[id].name : ""),
        el("span", { class: "val" }, reveal ? value : "")));
    if (found && flipSlot !== i) tile.classList.remove("revealed"), tile.classList.add("shown");
    return tile;
  }));
}

function renderSuggestions() {
  const box = $("suggest");
  if (round.over) { box.replaceChildren(); return; }
  const list = round.matcher.completions($("guess").value).filter(e => !round.guessed.has(e.id));
  box.replaceChildren(...list.map(e => el("button", { type: "button", onclick: () => commit(e) }, e.name)));
}

function setFeedback(fb, actions = []) {
  const box = $("feedback");
  if (!fb) { box.hidden = true; box.replaceChildren(); return; }
  box.hidden = false;
  box.className = "feedback" + (fb.tone === "good" ? " good" : fb.tone === "bad" ? " bad" : "");
  box.replaceChildren(el("p", {}, fb.text));
  if (actions.length) box.append(el("div", { class: "actions" }, ...actions));
}

function commit(entry) {
  const fb = guessEntry(round, entry);
  afterGuess(fb);
}

function afterGuess(fb) {
  $("guess").value = "";
  setFeedback(fb);
  renderAll();
  if (fb.slot !== undefined) renderBoard(fb.slot);
  if (round.over) finish(); else $("guess").focus({ preventScroll: true });
}

function onSubmit(ev) {
  ev.preventDefault();
  const raw = $("guess").value;
  if (!raw.trim() || round.over) return;
  const name = raw.trim();
  // Free-form questions (any surname is a real guess) always offer the text as typed.
  const asTyped = round.q.freeform
    ? [el("button", { class: "btn ghost small", type: "button", onclick: () => afterGuess(guessFreeform(round, name)) }, `No, guess ${name}`)]
    : [];
  const res = round.matcher.lookup(raw);
  if (res.kind === "exact") return commit(res.entry);
  if (res.kind === "suggest") {
    return setFeedback({ tone: "info", text: `Did you mean ${res.entry.name}?` }, [
      el("button", { class: "btn small", type: "button", onclick: () => commit(res.entry) }, `Guess ${res.entry.name}`),
      ...(asTyped.length ? asTyped
        : [el("button", { class: "btn ghost small", type: "button", onclick: () => { setFeedback(null); $("guess").focus(); } }, "No")]),
    ]);
  }
  if (res.kind === "choose") {
    return setFeedback({ tone: "info", text: "Which one did you mean?" },
      [...res.entries.map(e => el("button", { class: "btn ghost small", type: "button", onclick: () => commit(e) }, e.name)), ...asTyped]);
  }
  if (round.q.freeform) {
    return setFeedback({ tone: "info", text: `${name} isn't on our list of common names. Guess it anyway?` }, [
      el("button", { class: "btn small", type: "button", onclick: () => afterGuess(guessFreeform(round, name)) }, `Guess ${name}`),
      el("button", { class: "btn ghost small", type: "button", onclick: () => { setFeedback(null); $("guess").focus(); } }, "Cancel"),
    ]);
  }
  setFeedback({ tone: "info", text: `We don't recognize "${raw.trim()}". Check the spelling. No strike.` });
}

function renderStop() {
  const row = $("stop-row");
  row.hidden = false;
  row.replaceChildren(el("button", { class: "btn ghost small", type: "button", onclick: confirmStop }, "I'm done"));
}

function confirmStop() {
  const pts = scoreOf(round).base;
  $("stop-row").replaceChildren(
    el("p", {}, `Stop now and keep ${pts} point${pts === 1 ? "" : "s"}?`),
    el("button", { class: "btn small", type: "button", onclick: () => { end(round, "stopped"); setFeedback(null); renderAll(); finish(); } }, "Stop and keep points"),
    el("button", { class: "btn ghost small", type: "button", onclick: renderStop }, "Keep playing"));
}

function finish() {
  $("entry").hidden = true;
  $("stop-row").hidden = true;
  const s = scoreOf(round);
  saveScore(round.q.id, { score: s.total, found: round.found.size, misses: round.misses.length, end: round.endReason });
}

function renderResult() {
  const r = round, s = scoreOf(r);
  const heads = { sweep: s.sweep ? "Clean sweep!" : "All five found", stopped: "You stopped", struck: "Three strikes" };
  $("result-h").textContent = `${heads[r.endReason]}: ${s.total} points`;
  const rows = [
    [`${r.found.size} found × ${RULES.pointsPerFind}`, `${r.found.size * RULES.pointsPerFind}`],
    [`${r.misses.length} miss${r.misses.length === 1 ? "" : "es"} × ${RULES.strikeCost}`, r.misses.length ? `−${r.misses.length * RULES.strikeCost}` : "0"],
  ];
  if (s.base === 0 && r.found.size * RULES.pointsPerFind < r.misses.length * RULES.strikeCost) rows.push(["Score can't go below 0", ""]);
  if (s.sweep) rows.push(["Clean sweep bonus", `+${s.sweep}`]);
  $("breakdown").replaceChildren(...rows.flatMap(([a, b]) => [el("dt", {}, a), el("dd", {}, b)]),
    el("dt", { class: "total" }, "Total"), el("dd", { class: "total" }, String(s.total)));
  $("near").replaceChildren(el("h4", {}, "Just missed the list"), el("ol", {}, ...r.q.near.map(([id, label, value]) =>
    el("li", {}, el("span", {}, r.byId[id].name + (value ? ` · ${value}` : "")),
      el("span", { class: "r" }, r.q.nearShow ? r.q.nearShow(label) : label)))));
  $("share-text").textContent = shareText(r);
  $("copy-msg").hidden = true;
  $("result").hidden = false;
}

async function copyResult() {
  const text = $("share-text").textContent;
  const msg = $("copy-msg");
  try {
    await navigator.clipboard.writeText(text);
    msg.textContent = "Copied. Paste it in your group chat.";
  } catch {
    const range = document.createRange();
    range.selectNodeContents($("share-text"));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
    msg.textContent = "Couldn't copy automatically. The text is selected, so copy it yourself.";
  }
  msg.hidden = false;
}

function nextPuzzle() {
  const scores = loadScores();
  const i = QUESTIONS.indexOf(round.q);
  const order = [...QUESTIONS.slice(i + 1), ...QUESTIONS.slice(0, i)];
  const next = order.find(q => !scores[q.id]) || order[0];
  startGame(next);
}

$("guess-form").addEventListener("submit", onSubmit);
$("guess").addEventListener("input", () => { renderSuggestions(); });
$("back").addEventListener("click", showMenu);
$("copy").addEventListener("click", copyResult);
$("next").addEventListener("click", nextPuzzle);
$("reset").addEventListener("click", () => {
  try { localStorage.removeItem(STORE_KEY); } catch {}
  $("reset-msg").textContent = "Scores cleared on this device.";
  $("reset-msg").hidden = false;
  renderMenu();
});
renderMenu();
</script>
</body>
</html>
